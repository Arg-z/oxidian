[workspace]
resolver = "2"
members = ["crates/oxidian-core", "crates/oxidian-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
oxidian-core = { path = "crates/oxidian-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
gray_matter = "0.3"
notify = "8"
thiserror = "2"

# Disk VM terbatas: tanpa debuginfo & incremental
[profile.dev]
debug = false
incremental = false

[profile.release]
strip = true
lto = "thin"
