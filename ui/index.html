<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oxidian</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ================= Welcome / pemilih vault ================= -->
  <div id="welcome" class="welcome hidden">
    <div class="welcome-card">
      <svg class="logo" viewBox="0 0 256 256" width="72" height="72" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3a2a5a"/><stop offset="1" stop-color="#28223a"/>
          </linearGradient>
        </defs>
        <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#lg)"/>
        <polygon points="128,46 178,96 178,170 128,214 78,170 78,96" fill="#7c5cff" opacity="0.9"/>
        <polygon points="128,46 178,96 78,96" fill="#a88aff"/>
        <polygon points="128,214 178,170 78,170" fill="#46349c"/>
        <circle cx="160" cy="107" r="10" fill="#dccdff"/>
      </svg>
      <h1>Oxidian</h1>
      <p class="muted">Aplikasi pencatatan Markdown — vault kompatibel dengan Obsidian.<br/>Data Anda adalah file <code>.md</code> biasa.</p>

      <div class="welcome-actions">
        <button id="btn-open-vault" class="primary">Buka Folder Vault…</button>
        <button id="btn-new-vault" class="ghost">Buat Vault Baru…</button>
      </div>

      <div class="welcome-recent" id="welcome-recent"></div>

      <div class="welcome-manual">
        <input id="vault-path-input" type="text" placeholder="…atau tempel path vault di sini" />
        <button id="btn-vault-path-go">Buka</button>
      </div>
      <p id="welcome-error" class="error hidden"></p>
    </div>
  </div>

  <!-- ================= Layout utama ================= -->
  <div id="app" class="app hidden">
    <div class="topbar">
      <div class="topbar-left">
        <span class="brand">◆ Oxidian</span>
        <span id="vault-name" class="vault-name muted"></span>
      </div>
      <div class="topbar-actions">
        <button id="btn-new-note" title="Note baru (Ctrl+N)">＋ Note</button>
        <button id="btn-new-folder" title="Folder baru">＋ Folder</button>
        <button id="btn-graph" title="Graph view (Ctrl+G)">.Graph</button>
        <button id="btn-open-other" title="Buka vault lain">Vault…</button>
      </div>
    </div>

    <div class="main">
      <!-- ---------- Sidebar kiri ---------- -->
      <aside class="sidebar">
        <div class="side-section">
          <div class="search-row">
            <input id="search-input" type="text" placeholder="Cari di vault…" />
          </div>
          <div id="search-results" class="search-results hidden"></div>
        </div>

        <div class="side-section grow">
          <div class="section-head">
            <span>Files</span>
            <span class="muted" id="note-count"></span>
          </div>
          <div id="file-tree" class="file-tree"></div>
        </div>

        <div class="side-section" id="tags-section">
          <div class="section-head toggleable" id="tags-toggle">
            <span>Tags</span><span class="muted" id="tag-count"></span>
          </div>
          <div id="tag-list" class="tag-list hidden"></div>
        </div>
      </aside>

      <!-- ---------- Editor tengah ---------- -->
      <section class="editor-pane">
        <div class="editor-head">
          <span id="note-title" class="note-title">—</span>
          <div class="editor-head-actions">
            <button id="btn-mode" title="Edit / Preview (Ctrl+E)">👁 Preview</button>
          </div>
        </div>

        <div class="editor-body">
          <textarea id="editor" class="hidden" spellcheck="false" placeholder="Mulai menulis… gunakan [[Nama Note]] untuk membuat link"></textarea>
          <div id="preview" class="preview"></div>
          <div id="empty-state" class="empty-state">
            <p>Pilih note di sidebar,<br/>atau tekan <kbd>Ctrl+P</kbd> untuk quick switcher.</p>
          </div>
        </div>

        <div id="wikibox" class="wikibox hidden"></div>
      </section>

      <!-- ---------- Panel kanan ---------- -->
      <aside class="rightpane">
        <div class="side-section">
          <div class="section-head"><span>Backlinks</span></div>
          <div id="backlinks" class="link-list"><span class="muted">—</span></div>
        </div>
        <div class="side-section">
          <div class="section-head"><span>Outgoing links</span></div>
          <div id="outlinks" class="link-list"><span class="muted">—</span></div>
        </div>
        <div class="side-section">
          <div class="section-head"><span>Properties</span></div>
          <div id="properties" class="properties"><span class="muted">—</span></div>
        </div>
      </aside>
    </div>

    <div class="statusbar">
      <span id="status-save" class="muted"></span>
      <span class="spacer"></span>
      <span id="status-vault" class="muted"></span>
    </div>
  </div>

  <!-- ================= Quick switcher ================= -->
  <div id="qs-overlay" class="overlay hidden">
    <div class="qs-box">
      <input id="qs-input" type="text" placeholder="Cari note… (↑↓ pilih, Enter buka)" />
      <div id="qs-results"></div>
    </div>
  </div>

  <!-- ================= Modal generik ================= -->
  <div id="modal-overlay" class="overlay hidden">
    <div class="modal-box">
      <div id="modal-title" class="modal-title"></div>
      <input id="modal-input" type="text" class="hidden" />
      <div id="modal-text" class="modal-text muted"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="ghost">Batal</button>
        <button id="modal-ok" class="primary">OK</button>
      </div>
    </div>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
