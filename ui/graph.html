<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Oxidian — Graph View</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { height: 100%; overflow: hidden; background: #161618; }
    #gc { position: absolute; inset: 0; width: 100%; height: 100%; }
    .gtop {
      position: fixed; top: 0; left: 0; right: 0; height: 34px; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; font-size: 12px; color: var(--text-muted);
      background: rgba(22, 22, 24, 0.92);
      border-bottom: 1px solid var(--border);
    }
    .gtop b { color: var(--accent); }
    .ghint {
      position: fixed; bottom: 0; left: 0; right: 0; height: 26px; z-index: 2;
      display: flex; align-items: center; gap: 10px; padding: 0 12px;
      font-size: 11.5px; color: var(--text-faint);
      background: rgba(22, 22, 24, 0.92); border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="gtop">
    <span><b>◆ Graph View</b> — klik node untuk membuka note di jendela utama</span>
    <span id="gstat"></span>
  </div>
  <canvas id="gc"></canvas>
  <div class="ghint">
    <span id="ghint"></span>
    <span class="spacer"></span>
    <span>scroll = zoom · drag = geser / pindahkan node</span>
  </div>
  <script src="graph.js"></script>
</body>
</html>
